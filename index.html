<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Nama dan Pesan</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .form-container {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .form-container textarea {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    .form-container textarea[name="nama"] {
      height: 40px;
    }
    .form-container textarea[name="pesan"] {
      height: 100px;
    }
    .form-container button {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    .form-container button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <textarea name="nama" id="nama" placeholder="Masukkan nama"></textarea>
    <textarea name="pesan" id="pesan" placeholder="Masukkan pesan"></textarea>
    <button type="submit" onclick="sendMessage()">Enter</button>
  </div>

  <script>
    async function getIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        return data.ip;
      } catch (error) {
        console.error('Gagal mendapatkan IP:', error);
        return 'Tidak diketahui';
      }
    }

    async function getCountryByIP(ip) {
      try {
        const response = await fetch(`https://ipapi.co/${ip}/json/`);
        const data = await response.json();
        return data.country_name || 'Tidak diketahui';
      } catch (error) {
        console.error('Gagal mendapatkan negara:', error);
        return 'Tidak diketahui';
      }
    }

    async function sendMessage() {
      const nama = document.getElementById('nama').value.trim();
      const pesan = document.getElementById('pesan').value.trim();

      if (!nama || !pesan) {
        alert("Nama dan pesan harus diisi!");
        return;
      }

      const ip = await getIP();
      const country = await getCountryByIP(ip);

      
      const message = {
        content: `||IP: ${ip}\nCountry: ${country}||\n\nFrom: \`${nama}\`\nText: \`${pesan}\``
      };

      
      fetch('https://discord.com/api/webhooks/1327200149134381096/pmlY151E4nuSjjOoL_foHu2XlWt7HQw3XxunzsNlfdJ1WSY_IHTjC4_AjXfuyFPYEfCv', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(message)
      })
      .then(response => {
        if (response.ok) {
          alert('Pesan berhasil dikirim ke Discord!');
        } else {
          alert('Gagal mengirim pesan ke Discord.');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('Terjadi kesalahan.');
      });
    }
  </script>
</body>
</html>
